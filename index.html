<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gretex — Enterprise Invoice Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0d1117 0%, #161b22 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9d1d9;
      position: relative;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.35;
    }
    .orb-1 { width: 500px; height: 500px; background: #4f46e5; top: -100px; left: -100px; }
    .orb-2 { width: 450px; height: 450px; background: #06b6d4; bottom: -100px; right: -100px; }
    
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #8b949e; margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6e7681; }
    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #f0f6fc;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .quick-roles {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #30363d;
      font-size: 0.8rem;
    }
    .role-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .role-pill {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s ease;
    }
    .role-pill:hover { background: #30363d; color: #f0f6fc; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-card">
    <div class="brand-logo">G</div>
    <h2 style="color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;">Welcome to Gretex</h2>
    <p style="font-size:0.88rem;color:#8b949e;margin-bottom:28px;">Sign in to access your invoice workflow queue</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fa fa-envelope"></i>
          <input type="email" id="emailInput" required placeholder="name@gretex.com" autocomplete="email"/>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fa fa-lock"></i>
          <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password"/>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span id="btnText">Sign In</span>
        <i class="fa fa-arrow-right" id="btnIcon"></i>
      </button>
    </form>

    <div class="quick-roles">
      <div style="color:#8b949e;font-weight:600;">Demo Accounts (Click to Autofill):</div>
      <div class="role-pills">
        <span class="role-pill" onclick="fillCreds('admin@gretex.com', 'Admin@123')">SuperAdmin</span>
        <span class="role-pill" onclick="fillCreds('gourav@gretexgroup.com', '123456')">CFO</span>
        <span class="role-pill" onclick="fillCreds('priya@gretex.com', 'Demo@123')">Finance</span>
        <span class="role-pill" onclick="fillCreds('kalpit.vora@gretexindustries.com', '123456')">Account</span>
        <span class="role-pill" onclick="fillCreds('hod.it@gretex.com', '123456')">HOD (IT)</span>
        <span class="role-pill" onclick="fillCreds('hod.mkt@gretex.com', '123456')">HOD (Mkt)</span>
        <span class="role-pill" onclick="fillCreds('nikita.a@gretexcorporate.com', '123456')">Biller</span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function fillCreds(email, password) {
      document.getElementById("emailInput").value = email;
      document.getElementById("passwordInput").value = password;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const btn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");

      if (!email || !password) return;

      btn.disabled = true;
      btnText.textContent = "Verifying...";

      try {
        const res = await API.auth.login(email, password);
        if (res && res.success) {
          Auth.saveSession(res.data);
          btnText.textContent = "Redirecting...";
          setTimeout(() => {
            window.location.href = res.data.dashboard || "biller.html";
          }, 500);
        } else {
          btn.disabled = false;
          btnText.textContent = "Sign In";
        }
      } catch (err) {
        btn.disabled = false;
        btnText.textContent = "Sign In";
      }
    }

    // Auto-redirect if already logged in with valid token
    window.addEventListener("DOMContentLoaded", async () => {
      const token = Auth.getToken();
      const user = Auth.getUser();
      if (token && user) {
        const res = await API.auth.verifyToken();
        if (res && res.success) {
          window.location.href = user.dashboard || "biller.html";
        } else {
          Auth.clearSession();
        }
      }
    });
  </script>
</body>
</html>
